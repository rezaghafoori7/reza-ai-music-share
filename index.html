<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>آهنگ‌های Reza AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
<style>
:root{--accent:#8b7cff;--glass:rgba(17,24,39,.58);--text:#fff}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Vazirmatn,sans-serif;color:var(--text);min-height:100vh;background:linear-gradient(135deg,#071827,#101529 55%,#2b1625);overflow-x:hidden}body:before{content:"";position:fixed;inset:-20%;z-index:-2;background:radial-gradient(circle at 15% 20%,#2496d4 0,transparent 22%),radial-gradient(circle at 85% 70%,#ff7a18 0,transparent 21%),radial-gradient(circle at 65% 15%,#6d4aff 0,transparent 18%);filter:blur(45px);animation:float 12s ease-in-out infinite alternate}@keyframes float{to{transform:translate3d(3%,2%,0) scale(1.08)}}.glass{background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.13);box-shadow:0 20px 60px rgba(0,0,0,.28)}header{height:84px;margin:18px 24px 0;border-radius:24px;display:flex;align-items:center;justify-content:space-between;padding:10px 18px}.brand{display:flex;align-items:center;gap:12px}.brand img,.profile{width:56px;height:56px;border-radius:18px;object-fit:cover;border:2px solid rgba(255,255,255,.32)}h1{font-size:20px;margin:0}.iconbtn{border:0;color:white;border-radius:16px;width:46px;height:46px;cursor:pointer;background:rgba(255,255,255,.1);font-size:20px}.iconbtn:hover{background:rgba(255,255,255,.18)}main{max-width:1180px;margin:24px auto;padding:0 24px}.hero{position:relative;border-radius:32px;min-height:330px;overflow:hidden;padding:32px;display:flex;align-items:end}.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.9);z-index:-2}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,10,22,.2),rgba(4,10,22,.88));z-index:-1}.hero-copy{max-width:600px}.hero-copy small{letter-spacing:.2em;opacity:.75}.hero-copy h2{font-size:38px;margin:10px 0}.hero-copy p{line-height:1.9;color:rgba(255,255,255,.78)}.toolbar{display:flex;gap:10px;margin-top:16px}.btn{border:0;border-radius:14px;padding:12px 18px;color:white;text-decoration:none;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px}.primary{background:linear-gradient(135deg,var(--accent),#b56cff)}.secondary{background:rgba(255,255,255,.12)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:30px 4px 14px}.section-title h3{margin:0}.tracks{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px}.track{border-radius:22px;padding:10px;transition:.25s}.track:hover{transform:translateY(-5px)}.cover{width:100%;aspect-ratio:1.45;object-fit:cover;border-radius:16px}.track-info{padding:10px 6px}.track-info h4{margin:3px 0}.track-info p{margin:5px 0;color:rgba(255,255,255,.62);font-size:13px}.track-actions{display:flex;gap:8px}.track-actions button,.track-actions a{flex:1}.modal{position:fixed;inset:0;background:rgba(2,6,23,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.panel{width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:24px;padding:22px}.panel h3{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field input,.field textarea{width:100%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);border-radius:12px;color:white;padding:12px;font-family:inherit}.field textarea{height:90px;resize:vertical}.panel-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.player{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(680px,calc(100% - 32px));height:76px;border-radius:22px;padding:9px 12px;display:none;align-items:center;gap:10px;z-index:10}.player.open{display:flex}.player img{width:58px;height:58px;border-radius:14px;object-fit:cover}.player-main{flex:1}.player-main b{display:block;font-size:14px}.player audio{width:100%;height:32px;margin-top:2px}.empty{text-align:center;padding:45px;border-radius:22px;color:rgba(255,255,255,.7)}@media(max-width:700px){header{margin:10px;height:72px}main{padding:0 12px}.hero{min-height:300px;padding:22px}.hero-copy h2{font-size:28px}.grid{grid-template-columns:1fr}.brand h1{font-size:16px}.tracks{grid-template-columns:1fr 1fr}}@media(max-width:470px){.tracks{grid-template-columns:1fr}}
</style></head>
<body>
<header class="glass"><div class="brand"><img id="brandAvatar" alt=""><div><h1 id="siteName">آهنگ‌های Reza AI</h1></div></div><button class="iconbtn" id="openSettings" title="تنظیمات">⚙</button></header>
<main><section class="hero glass"><img id="heroImage" class="hero-bg" alt=""><div class="hero-copy"><small>OFFICIAL MUSIC</small><h2 id="heroTitle">موسیقی Reza AI</h2><p id="heroText">همه‌ی آهنگ‌ها در یکجا؛ گوش دهید، لذت ببرید و دانلود کنید.</p><div class="toolbar"><button class="btn primary" id="playHero">▶ پخش آخرین آهنگ</button></div></div></section>
<div class="section-title"><h3>آهنگ‌ها</h3><button class="btn secondary" id="addTrack">＋ افزودن آهنگ</button></div><div class="tracks" id="tracks"></div></main>
<div class="player glass" id="player"><img id="playerCover" alt=""><div class="player-main"><b id="playerTitle"></b><audio id="audio" controls></audio></div></div>
<div class="modal" id="settingsModal"><div class="panel glass"><h3>تنظیمات سایت</h3><div class="grid">
<div class="field"><label>نام سایت</label><input id="sName"></div><div class="field"><label>عنوان اصلی</label><input id="sHeroTitle"></div>
<div class="field full"><label>متن معرفی</label><textarea id="sHeroText"></textarea></div>
<div class="field"><label>لینک عکس خودتان / لوگو</label><input type="url" id="sAvatar" placeholder="https://example.com/avatar.jpg"></div><div class="field"><label>لینک عکس کاور هدر</label><input type="url" id="sHero" placeholder="https://example.com/cover.jpg"></div>
</div><div class="panel-actions"><button class="btn secondary" data-close>بستن</button><button class="btn primary" id="saveSettings">ذخیره تنظیمات</button></div></div></div>
<div class="modal" id="trackModal"><div class="panel glass"><h3>افزودن آهنگ با لینک</h3><div class="grid">
<div class="field"><label>نام آهنگ</label><input id="tTitle"></div><div class="field"><label>نام خواننده</label><input id="tArtist"></div>
<div class="field full"><label>متن آهنگ</label><textarea id="tLyrics"></textarea></div>
<div class="field"><label>لینک کاور (اختیاری)</label><input type="url" id="tCover" placeholder="https://example.com/cover.jpg"></div><div class="field"><label>لینک مستقیم MP3</label><input type="url" id="tAudio" placeholder="https://example.com/song.mp3"></div>
</div><div class="panel-actions"><button class="btn secondary" data-close>بستن</button><button class="btn primary" id="saveTrack">افزودن آهنگ</button></div></div></div>
<script>
const $=id=>document.getElementById(id);const defaults={name:'آهنگ‌های Reza AI',heroTitle:'موسیقی Reza AI',heroText:'همه‌ی آهنگ‌ها در یکجا؛ گوش دهید، لذت ببرید و دانلود کنید.',avatar:'',hero:''};let settings=JSON.parse(localStorage.getItem('rezaSettings')||'null')||defaults;let tracks=JSON.parse(localStorage.getItem('rezaTracks')||'[]');
function applySettings(){ $('siteName').textContent=settings.name;document.title=settings.name;$('heroTitle').textContent=settings.heroTitle;$('heroText').textContent=settings.heroText;$('brandAvatar').src=settings.avatar||'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%235c6cff"/><text x="50" y="66" text-anchor="middle" font-size="48" fill="white">R</text></svg>';$('heroImage').src=settings.hero||settings.avatar||'';$('heroImage').style.display=settings.hero||settings.avatar?'block':'none'}
function esc(s=''){let d=document.createElement('div');d.textContent=s;return d.innerHTML}function urlSafe(u){try{let x=new URL(u);return ['http:','https:'].includes(x.protocol)?x.href:''}catch{return ''}}
function render(){let el=$('tracks');el.innerHTML='';if(!tracks.length){el.innerHTML='<div class="empty glass">هنوز آهنگی اضافه نشده است.</div>';return}tracks.forEach((t,i)=>{let card=document.createElement('article');card.className='track glass';card.innerHTML=`<img class="cover" src="${esc(t.cover||settings.hero||settings.avatar||'')}" alt=""><div class="track-info"><h4>${esc(t.title)}</h4><p>${esc(t.artist)} · ${t.lyrics?'متن آماده':'بدون متن'}</p><div class="track-actions"><button class="btn primary" data-play="${i}">▶ پخش</button><a class="btn secondary" href="${esc(t.audio)}" target="_blank" rel="noopener" download="${esc(t.title)}.mp3">↓ دانلود</a></div></div>`;el.appendChild(card)});document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>play(+b.dataset.play))}
function play(i){let t=tracks[i];if(!t||!t.audio)return alert('ابتدا لینک مستقیم MP3 را وارد کنید');$('player').classList.add('open');$('playerCover').src=t.cover||settings.avatar||'';$('playerTitle').textContent=t.title+' — '+t.artist;$('audio').src=t.audio;$('audio').play().catch(()=>{})}
applySettings();render();$('openSettings').onclick=()=>{$('settingsModal').classList.add('open');$('sName').value=settings.name;$('sHeroTitle').value=settings.heroTitle;$('sHeroText').value=settings.heroText;$('sAvatar').value=settings.avatar;$('sHero').value=settings.hero};$('addTrack').onclick=()=>$('trackModal').classList.add('open');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('open'));document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('open')});
$('saveSettings').onclick=()=>{settings={name:$('sName').value.trim()||defaults.name,heroTitle:$('sHeroTitle').value.trim()||defaults.heroTitle,heroText:$('sHeroText').value.trim()||defaults.heroText,avatar:urlSafe($('sAvatar').value),hero:urlSafe($('sHero').value)};localStorage.setItem('rezaSettings',JSON.stringify(settings));applySettings();render();$('settingsModal').classList.remove('open')};
$('saveTrack').onclick=()=>{let title=$('tTitle').value.trim(),audio=urlSafe($('tAudio').value);if(!title)return alert('نام آهنگ را وارد کنید');if(!audio)return alert('لینک مستقیم MP3 معتبر وارد کنید');tracks.unshift({title,artist:$('tArtist').value.trim()||'Reza AI',lyrics:$('tLyrics').value.trim(),cover:urlSafe($('tCover').value),audio});localStorage.setItem('rezaTracks',JSON.stringify(tracks));render();$('trackModal').classList.remove('open');['tTitle','tArtist','tLyrics','tCover','tAudio'].forEach(id=>$(id).value='')};$('playHero').onclick=()=>tracks.length?play(0):$('addTrack').click();
</script></body></html>
